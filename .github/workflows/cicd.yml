        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Purge Local State Residue
      run: rm -f terraform.tfstate terraform.tfstate.backup .terraform.tfstate
