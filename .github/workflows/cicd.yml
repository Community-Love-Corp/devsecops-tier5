name: End-to-End CI-CD Pipeline

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  # 1. INFRASTRUCTURE JOB
    # Handled locally now
# 2. BUILD JOB
  build:
    name: Build and Push Image

    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 1. ADDED: Authenticate this runner container with Azure
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to ACR
      run: az acr login --name jaydemoacr

    - name: Build image
      run: docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/jaydemo-api:v1 ./app

    - name: Push image
      run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/jaydemo-api:v1


  # 3. DEPLOY JOB (With Manual Approval)
  deploy:
    name: Deploy to AKS
    needs: build
    runs-on: ubuntu-latest
    environment: production  # <-- Triggers manual gate in GitHub
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 1. ADDED: Authenticate this runner container with Azure
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # FIXED: Replaces "Download kubeconfig" artifact with a clean native fetch
    - name: Get AKS Credentials
      run: |
        az aks get-credentials --resource-group jaydemo-rg --name jaydemo-aks --file ./kubeconfig

    # 2. FIXED: Explicit path mapping for the downloaded file
    - name: Set KUBECONFIG
      run: echo "KUBECONFIG=${{ github.workspace }}/kubeconfig" >> $GITHUB_ENV

    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    # 3. FIXED: Removed redundant local export variable mapping
    - name: Verify kubeconfig download
      run: |
        ls -la
        if kubectl get nodes &> /dev/null; then
          echo "Nodes available: Yes"
        else
          echo "Nodes available: No"
          kubectl get nodes --v=7 # Prints detailed error reason if it fails
          exit 1
        fi 
    - name: Apply manifests
      run: kubectl apply -f k8s/

  # 4. TEST JOB
  test:
    name: API Tests
    needs: deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 1. ADDED: Authenticate this runner container with Azure
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # FIXED: Replaces "Download kubeconfig" artifact with a clean native fetch
    - name: Get AKS Credentials
      run: |
        az aks get-credentials --resource-group jaydemo-rg --name jaydemo-aks --file ./kubeconfig

    # 2. FIXED: Explicit path mapping for the downloaded file
    - name: Set KUBECONFIG
      run: echo "KUBECONFIG=${{ github.workspace }}/kubeconfig" >> $GITHUB_ENV

    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    # 3. FIXED: Removed redundant local export variable mapping
    - name: Verify kubeconfig download
      run: |
        ls -la
        if kubectl get nodes &> /dev/null; then
          echo "Nodes available: Yes"
        else
          echo "Nodes available: No"
          kubectl get nodes --v=7 # Prints detailed error reason if it fails
          exit 1
        fi 
    - name: Install Node
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Wait for service external IP
      run: |
        for i in {1..30}; do
          IP=$(kubectl get svc jaydemo-api -o jsonpath="{.status.loadBalancer.ingress[0].ip}")
          echo "Current IP: $IP"
          HOST=$(kubectl get svc jaydemo-api -o jsonpath="{.status.loadBalancer.ingress[0].hostname}")
          echo "Current HOST: $HOST"          
          if [ -n "$IP" ]; then
            echo "API_URL=http://$IP" >> $GITHUB_ENV
            exit 0
          fi
          if [ -n "$HOST" ]; then
            echo "API_URL=http://$HOST" >> $GITHUB_ENV
            exit 0
          fi
          echo "Waiting for LoadBalancer IP..."
          sleep 10
        done
        echo "Timed out waiting for LoadBalancer IP"
        exit 1    

       
    - name: Make Typescript recognise Node.js global variables
      run: npm install --save-dev @types/node 
      working-directory: tests

    - name: List test output
      run: |
        echo "Listing test output:"
        ls -R tests
                                    
    - name: Run tests
      env:
        API_URL: ${{ env.API_URL }}
      run: |
        npx playwright install
        npx playwright test
      working-directory: tests

    - name: Upload Playwright HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: tests/playwright-report
        retention-days: 7

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: tests/allure-results
        retention-days: 7

  # 5. DESTROY JOB (With Manual Approval)
  destroy:
    name: Destroy Infrastructure
    needs: test
    runs-on: ubuntu-latest
    environment: destroy  # <-- Triggers manual gate in GitHub
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    # 1. ADDED: Authenticate this runner container with Azure
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}


    # FIXED: Replaces "Download kubeconfig" artifact with a clean native fetch
    - name: Get AKS Credentials
      run: |
        az aks get-credentials --resource-group jaydemo-rg --name jaydemo-aks --file ./kubeconfig

    # 2. FIXED: Explicit path mapping for the downloaded file
    - name: Set KUBECONFIG
      run: echo "KUBECONFIG=${{ github.workspace }}/kubeconfig" >> $GITHUB_ENV

    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    # 3. FIXED: Removed redundant local export variable mapping
    - name: Verify kubeconfig download
      run: |
        ls -la
        if kubectl get nodes &> /dev/null; then
          echo "Nodes available: Yes"
        else
          echo "Nodes available: No"
          kubectl get nodes --v=7 # Prints detailed error reason if it fails
          exit 1
        fi 
    - name: Terraform Destroy
      run: terraform destroy -input=false -auto-approve
      working-directory: terraform

